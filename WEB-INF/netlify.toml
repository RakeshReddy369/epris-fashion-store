[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# If hosting frontend and backend separately, uncomment to proxy API calls directly:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.up.railway.app/api/:splat"
#   status = 200
#   force = true

